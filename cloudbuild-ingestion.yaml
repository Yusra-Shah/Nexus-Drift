steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [build, -t, 'us-central1-docker.pkg.dev/adk-codelab-2026/nexusdrift/ingestion:latest', -f, 'services/ingestion/Dockerfile', .]
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, 'us-central1-docker.pkg.dev/adk-codelab-2026/nexusdrift/ingestion:latest']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '900s'
