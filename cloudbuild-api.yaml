steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [build, -t, 'us-central1-docker.pkg.dev/adk-codelab-2026/nexusdrift/api:latest', -f, 'services/api/Dockerfile', .]
  - name: 'gcr.io/cloud-builders/docker'
    args: [push, 'us-central1-docker.pkg.dev/adk-codelab-2026/nexusdrift/api:latest']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '900s'
